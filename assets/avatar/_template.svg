    <rect x="0" y="60" width="500" height="680" fill="none" stroke="#00A8C0" stroke-width="2" opacity="0.5"/>
    <line x1="250" y1="0" x2="250" y2="800" stroke="#00A8C0" stroke-width="1" stroke-dasharray="4 6" opacity="0.7"/>
    <line x1="286" y1="0" x2="286" y2="800" stroke="#E0A030" stroke-width="1" stroke-dasharray="2 8" opacity="0.9"/>
    <text x="291" y="792" font-family="monospace" font-size="10" fill="#B07818">limite de luz 286</text>
