    <line x1="0" y1="182" x2="500" y2="182" stroke="#00A8C0" stroke-width="1" stroke-dasharray="6 5" opacity="0.55"/><text x="6" y="178" font-family="monospace" font-size="10" fill="#00A8C0">mouth 182</text>
